user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # 基础性能优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # GZIP 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # MIME 类型
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志配置
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # 主服务器配置（HTTP 协议）
    server {
        listen 80;
        # server_name example.com www.example.com;  # 替换为你的域名

        # 静态文件路径（Vue 生产构建目录）
        root /app/dist;
        index index.html;

        # 处理 Vue History 模式路由（SPA 必须配置）
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 反向代理 FastAPI 后端（假设 FastAPI 运行在 8000 端口）
        location /api/ {
            proxy_pass http://api:8000/;  # 根据实际情况修改 IP:端口
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 添加自定义请求头（示例：传递 Bearer Token）
            # proxy_headers Authorization "Bearer $http_authorization";
        }

        # 静态资源缓存（CSS/JS/图片等）
        location ~* \.(jpg|css|js|png|gif|ico|svg)$ {
            expires 7d;
            access_log off;
            add_header Cache-Control "public";
        }

        # 错误页面配置（可选）
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        location /50x.html {
            root /var/www/vue-app/dist;
        }
    }
}